<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optima Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#1D4ED8;--primary-dark:#1E3A8A;--primary-light:#DBEAFE;
  --accent:#F59E0B;--accent-light:#FEF3C7;--success:#10B981;--danger:#EF4444;
  --bg:#F3F4F6;--surface:#FFFFFF;--surface-2:#F9FAFB;
  --text:#111827;--text-2:#4B5563;--muted:#9CA3AF;--border:#E5E7EB;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);--radius:12px;--radius-sm:8px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0D14;--surface:#1A1A2E;--surface-2:#16213E;
  --text:#F3F4F6;--text-2:#D1D5DB;--muted:#6B7280;--border:#2D2D44;
  --primary-light:#1E3A8A;--accent-light:#451A03;
  --shadow:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0D0D14;--surface:#1A1A2E;--surface-2:#16213E;
  --text:#F3F4F6;--text-2:#D1D5DB;--muted:#6B7280;--border:#2D2D44;
  --primary-light:#1E3A8A;--accent-light:#451A03;
  --shadow:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
button{font-family:inherit;cursor:pointer;}input,select,textarea{font-family:inherit;}

/* HEADER */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--primary);padding:0 16px;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;height:56px;}
.logo{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.5px;white-space:nowrap;}
.logo em{font-style:normal;opacity:.55;font-weight:500;}
.cat-btn{padding:7px 12px;background:rgba(255,255,255,.18);border:none;border-radius:7px;color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.cat-btn:hover{background:rgba(255,255,255,.28);}
.search-bar{display:flex;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;height:36px;}
.search-bar input{flex:1;padding:0 12px;border:none;background:transparent;color:#fff;font-size:13px;outline:none;min-width:0;}
.search-bar input::placeholder{color:rgba(255,255,255,.5);}
.search-bar button{padding:0 14px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;}
.search-bar button:hover{background:rgba(255,255,255,.32);}
.hact{display:flex;gap:7px;}
.hbtn{background:rgba(255,255,255,.18);border:none;border-radius:7px;padding:7px 10px;color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;position:relative;}
.hbtn:hover{background:rgba(255,255,255,.3);}
.badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;opacity:0;transform:scale(0);transition:all .2s;}
.badge.on{opacity:1;transform:scale(1);}

/* SUBNAV */
.subnav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.subnav::-webkit-scrollbar{display:none;}
.sn{padding:9px 14px;font-size:13px;font-weight:500;color:var(--text-2);border:none;background:none;white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .15s;display:flex;align-items:center;gap:5px;}
.sn:hover{color:var(--primary);}
.sn.active{color:var(--primary);border-bottom-color:var(--primary);}

/* BANNER SECTION */
.banner-section{background:var(--surface);padding:10px 16px 10px;}
.banner-grid{max-width:1200px;margin:0 auto;}

/* HERO SLIDER — full width, Tokopedia style */
.hero-slider{position:relative;border-radius:16px;overflow:hidden;min-height:200px;}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;display:flex;align-items:center;padding:28px 36px;border-radius:16px;}
/* Diagonal texture on slides */
.slide::before{
  content:'';position:absolute;inset:0;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 14px);
  pointer-events:none;z-index:0;
}
/* Decorative circles */
.slide::after{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none;z-index:0;}
.slide.active{opacity:1;z-index:1;}
.slide-content{flex:1;position:relative;z-index:1;}
.slide-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);border-radius:20px;padding:3px 10px 3px 4px;margin-bottom:10px;border:1px solid rgba(255,255,255,.2);}
.slide-tag-dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:9px;}
.slide-tag-text{font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.07em;}
.slide-title{font-size:26px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px;}
.slide-sub{font-size:13.5px;color:rgba(255,255,255,.85);margin-bottom:14px;}
.slide-disc-badge{display:inline-flex;align-items:baseline;gap:3px;background:rgba(0,0,0,.22);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 13px;margin-bottom:13px;}
.disc-prefix{font-size:11px;font-weight:600;color:rgba(255,255,255,.75);}
.disc-val{font-size:30px;font-weight:900;color:#fff;line-height:1;}
.disc-pct{font-size:14px;font-weight:800;color:rgba(255,255,255,.9);}
.slide-cta{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;background:#fff;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .15s;}
.slide-cta:hover{opacity:.88;transform:translateY(-1px);}
.slide-emoji{font-size:120px;line-height:1;position:absolute;right:40px;bottom:10px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.3));pointer-events:none;user-select:none;z-index:1;}
.slide-img{position:absolute;right:0;top:0;bottom:0;width:42%;z-index:1;pointer-events:none;overflow:hidden;}
.slide-img img{width:100%;height:100%;object-fit:cover;object-position:center top;-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 20%,black 50%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 20%,black 50%);}
.slider-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;}
.dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);border:none;padding:0;transition:all .3s;cursor:pointer;}
.dot.active{width:18px;background:#fff;}
.slider-prev,.slider-next{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);border:none;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .15s;}
.slider-prev{left:8px;}.slider-next{right:8px;}
.slider-prev:hover,.slider-next:hover{background:rgba(255,255,255,.45);}

/* SIDE BANNERS */
.side-banners{display:grid;grid-template-rows:1fr 1fr;gap:12px;}
.side-banner{
  border-radius:18px;overflow:hidden;cursor:pointer;
  position:relative;min-height:112px;
  display:flex;align-items:stretch;
  transition:transform .18s,box-shadow .18s;
}
.side-banner:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.22);}
/* Diagonal stripe texture */
.side-banner::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0,rgba(255,255,255,.04) 1px,transparent 1px,transparent 12px);
  pointer-events:none;
}
/* Discount strip — left column */
.sb-strip{
  width:56px;flex-shrink:0;
  background:rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:10px 0;
  position:relative;z-index:1;
  border-right:1px solid rgba(255,255,255,.12);
}
.sb-strip-pct{font-size:24px;font-weight:900;color:#fff;line-height:1;}
.sb-strip-off{font-size:8px;font-weight:800;color:rgba(255,255,255,.75);letter-spacing:.1em;text-transform:uppercase;}
/* Main area */
.sb-main{flex:1;padding:13px 13px 11px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1;}
.sb-main-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
.sb-label-pill{font-size:9px;font-weight:700;background:rgba(255,255,255,.2);color:rgba(255,255,255,.9);padding:2px 7px;border-radius:8px;border:1px solid rgba(255,255,255,.2);white-space:nowrap;}
.sb-emoji-big{font-size:36px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));}
.sb-img{width:54px;height:54px;border-radius:10px;overflow:hidden;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.25);}
.sb-img img{width:100%;height:100%;object-fit:cover;display:block;}
.sb-title{font-size:13px;font-weight:800;color:#fff;line-height:1.25;margin-top:5px;}
.sb-see{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.85);background:rgba(255,255,255,.18);padding:3px 9px;border-radius:10px;align-self:flex-start;border:1px solid rgba(255,255,255,.2);}
.side-banner:hover .sb-see{background:rgba(255,255,255,.3);}

/* SHORTCUT ROW */
.sc-section{background:var(--surface);border-top:1px solid var(--border);padding:14px 16px 16px;}
.sc-inner{max-width:1200px;margin:0 auto;}
.sc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sc-title{font-size:15px;font-weight:800;color:var(--text);}
.sc-more{font-size:12px;color:var(--primary);font-weight:600;background:none;border:none;cursor:pointer;}
.sc-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.sc-row::-webkit-scrollbar{display:none;}
.sc-item{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:68px;cursor:pointer;padding:6px 4px;border-radius:10px;border:none;background:none;transition:opacity .15s;}
.sc-item:hover{opacity:.75;}
.sc-icon{
  width:52px;height:52px;border-radius:14px;
  background:var(--surface);
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  transition:box-shadow .15s,border-color .15s;
}
.sc-item:hover .sc-icon{border-color:var(--primary);box-shadow:0 4px 12px rgba(29,78,216,.15);}
.sc-label{font-size:10.5px;font-weight:600;color:var(--text-2);text-align:center;line-height:1.2;white-space:nowrap;}

/* FLASH SALE BAR */
.fs-bar{background:linear-gradient(90deg,#FFF1F2,#FFF7ED);border-top:1px solid #FECDD3;padding:10px 16px;}
.fs-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.fs-left{display:flex;align-items:center;gap:10px;}
.fs-icon{font-size:22px;line-height:1;}
.fs-title{font-size:16px;font-weight:800;color:var(--danger);line-height:1.1;}
.fs-sub{font-size:11px;color:#9A3412;font-weight:500;}
.fs-timer{display:flex;align-items:center;gap:6px;}
.fs-time-lbl{font-size:11px;color:#9A3412;font-weight:500;}
.timer-box{display:flex;gap:4px;align-items:center;}
.tdig{background:var(--danger);color:#fff;font-size:13px;font-weight:800;padding:4px 8px;border-radius:6px;font-variant-numeric:tabular-nums;min-width:30px;text-align:center;box-shadow:0 2px 6px rgba(239,68,68,.3);}
.tsep{font-weight:800;color:var(--danger);font-size:14px;}

/* PAGE LAYOUT */
.page{max-width:1200px;margin:0 auto;padding:14px 16px 40px;}
.two-col{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start;}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:10px;}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.fl{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px;color:var(--text-2);}
.fl:hover{color:var(--primary);}
.fl.afl{color:var(--primary);font-weight:600;}
.fl input{accent-color:var(--primary);width:14px;height:14px;}
.pi-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
.pinp{width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text);font-size:12px;outline:none;}
.pinp:focus{border-color:var(--primary);}
.seller-chip{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border:none;background:none;text-align:left;width:100%;}
.seller-chip:hover{opacity:.7;}
.sa{width:32px;height:32px;border-radius:7px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.si{min-width:0;}
.si-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-meta{font-size:11px;color:var(--muted);}

/* MAIN */
.main{min-width:0;}
.tabs{display:flex;gap:4px;margin-bottom:12px;}
.tab{padding:7px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);font-size:13px;font-weight:500;transition:all .15s;}
.tab:hover{border-color:var(--primary);color:var(--primary);}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.sort-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
.res-count{font-size:13px;color:var(--text-2);}
.res-count strong{color:var(--text);font-weight:600;}
.sort-sel{padding:6px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;outline:none;}

/* PRODUCT GRID — flexbox 2 cols always, more on wider screens */
.pgrid{display:flex;flex-wrap:wrap;gap:10px;}
.pcard{flex:0 0 calc(50% - 5px);width:calc(50% - 5px);min-width:0;}
@media(min-width:860px){
  .pgrid{gap:12px;}
  .pcard{flex:0 0 calc(25% - 9px);width:calc(25% - 9px);}
}
.pcard{
  background:var(--surface);border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.07),0 0 0 1px var(--border);
  overflow:hidden;cursor:pointer;
  transition:box-shadow .2s,transform .18s;
  display:flex;flex-direction:column;
  position:relative;
}
.pcard:hover{box-shadow:0 8px 28px rgba(29,78,216,.13),0 0 0 1.5px var(--primary);transform:translateY(-3px);}

/* Image area */
.pi{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden;}
@media(min-width:860px){.pi{aspect-ratio:4/3;}}
.pi.cat-el{background:linear-gradient(145deg,#DBEAFE,#EFF6FF);}
.pi.cat-fa{background:linear-gradient(145deg,#FAE8FF,#FDF4FF);}
.pi.cat-rd{background:linear-gradient(145deg,#DCFCE7,#F0FDF4);}
.pi.cat-kb{background:linear-gradient(145deg,#FFEDD5,#FFF7ED);}
.pi.cat-ol{background:linear-gradient(145deg,#D1FAE5,#ECFDF5);}
.pi.cat-mk{background:linear-gradient(145deg,#FEF3C7,#FFFBEB);}
/* Inline SVG product illustration */
.pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px 8px 0 0;}
.pi-icon{display:none;}

/* Badges on image */
.pbadge{position:absolute;top:8px;left:8px;padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:700;color:#fff;letter-spacing:.03em;z-index:3;backdrop-filter:blur(4px);}
.pbadge.new{background:var(--success);}
.pbadge.hot{background:linear-gradient(90deg,#F97316,#EF4444);}
.pdisc-circle{
  position:absolute;top:7px;right:7px;z-index:3;
  min-width:34px;height:34px;border-radius:50%;padding:2px;
  background:var(--danger);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;line-height:1.1;text-align:center;
  box-shadow:0 2px 6px rgba(239,68,68,.4);
}

/* Card body */
.pb{padding:9px 9px 36px;flex:1;display:flex;flex-direction:column;}
.pname{font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);}

/* Seller */
.pselr{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:3px;cursor:pointer;margin-top:3px;}
.pselr:hover{color:var(--primary);}
.pdot{width:5px;height:5px;border-radius:50%;background:var(--success);flex-shrink:0;}

/* Variant chips */
.pvars{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.pvar{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--text-2);background:var(--surface-2);white-space:nowrap;}

/* Price row — red like Tokopedia */
.pprow{display:flex;align-items:center;gap:0;margin-top:6px;flex-direction:column;align-items:flex-start;}
.pp{font-size:15px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;line-height:1.1;}
.ppo-row{display:flex;align-items:center;gap:5px;margin-top:1px;}
.ppo{font-size:10.5px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums;}
.pdisc{font-size:9.5px;font-weight:700;color:var(--danger);background:#FEE2E2;padding:1px 5px;border-radius:3px;}

/* COD + Gratis Ongkir badge row */
.pbadge-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.pb-cod{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;white-space:nowrap;}
.pb-free{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0;white-space:nowrap;}

/* Rating */
.pst{font-size:10px;color:var(--accent);margin-top:4px;display:flex;align-items:center;gap:3px;}
.pst span{color:var(--muted);}

/* Seller row compact */
.pselr{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:3px;cursor:pointer;margin-top:3px;}
.pselr:hover{color:var(--primary);}

/* Mini floating + cart button — bottom-right */
.padd-mini{
  position:absolute;bottom:9px;right:9px;
  width:32px;height:32px;border-radius:50%;border:none;
  background:var(--primary);color:#fff;
  font-size:20px;font-weight:300;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:all .17s;
  box-shadow:0 2px 8px rgba(29,78,216,.4);
}
.padd-mini:hover{background:var(--primary-dark);transform:scale(1.1);}
.padd-mini.done{background:var(--success);box-shadow:0 2px 8px rgba(16,185,129,.4);font-size:14px;}

/* FLASH SALE SCROLL PRODUCTS */
.fs-scroll-wrap{background:var(--surface);padding:10px 0 16px;border-bottom:1px solid var(--border);}
.fs-scroll{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;}
.fs-scroll::-webkit-scrollbar{display:none;}
.fsp{flex:0 0 115px;background:var(--surface);border-radius:12px;overflow:hidden;cursor:pointer;border:1.5px solid var(--border);transition:border-color .15s,box-shadow .15s;}
.fsp:hover{border-color:var(--danger);box-shadow:0 4px 14px rgba(239,68,68,.15);}
.fsp-img{height:86px;position:relative;overflow:hidden;background:var(--surface-2);}
.fsp-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.fsp-body{padding:6px 8px 9px;}
.fsp-name{font-size:11px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;color:var(--text);}
.fsp-price{font-size:12.5px;font-weight:800;color:var(--danger);margin-top:4px;font-variant-numeric:tabular-nums;}

.br-preview{width:52px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}

.toggle-sw .sl:before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.2s;}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--surface);padding:10px 20px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);}

/* ── MOBILE ≤700px ── */
@media(max-width:700px){

  /* Banner — full-width single slider */

  /* Shortcuts row */

  .sc-label{font-size:10.5px;}

  /* Flash sale bar — stack vertically */
  .fs-inner{flex-direction:column;align-items:flex-start;gap:8px;}
  .fs-timer{width:100%;display:flex;align-items:center;gap:8px;}
  .timer-box{gap:4px;}
  /* Flash sale scroll tiles */
  .fsp{flex:0 0 105px;}

  /* Layout */
  .two-col{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .page{padding:10px 12px 80px;}

  /* Product grid — 2 columns on mobile */
  .pgrid{gap:8px;}
  .pcard{flex:0 0 calc(50% - 4px);width:calc(50% - 4px);}
  .pb{padding:8px 8px 34px;}
  .pname{font-size:11.5px;}
  .pp{font-size:13.5px;}
  .pb-cod,.pb-free{font-size:8.5px;padding:1px 4px;}

  .pselr{font-size:9.5px;}

  /* Seller grid */
  .seller-grid{grid-template-columns:repeat(2,1fr);}

  /* Admin FAB — smaller, avoid overlap */
  .admin-fab{bottom:16px;right:16px;padding:8px 13px;font-size:12px;}

  .toast{bottom:70px;}
}

// BANNER RENDERING
function renderBanners(){
  const heroActive=BANNERS.filter(b=>b.type==='hero'&&b.active);
  const sideActive=BANNERS.filter(b=>b.type==='side'&&b.active);
  const slider=document.getElementById('heroSlider');
  slider.querySelectorAll('.slide').forEach(e=>e.remove());
  const idx=currentSlide%Math.max(heroActive.length,1);
  heroActive.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(i===idx?' active':'');
    el.style.background=b.bg;
    const bImg=b.imgId&&PIMGB64[b.imgId]?`<div class="slide-img"><img src="${PIMGB64[b.imgId]}" loading="lazy" alt=""></div>`:`<div class="slide-emoji">${b.emoji}</div>`;
    el.innerHTML=`<div class="slide-content">
      <div class="slide-tag"><div class="slide-tag-dot">✦</div><span class="slide-tag-text">Promo Spesial</span></div>
      <div class="slide-title">${b.title}</div>
      <div class="slide-sub">${b.sub}</div>
      <div class="slide-disc-badge"><span class="disc-prefix">Diskon s.d</span><span class="disc-val">${b.disc}</span><span class="disc-pct">%</span></div>
      <button class="slide-cta" style="color:${ctaColor(b.bg)}">Lihat Koleksi &rarr;</button>
    </div>${bImg}`;
    slider.insertBefore(el,slider.querySelector('.slider-dots'));
  });
  document.getElementById('sliderDots').innerHTML=heroActive.map((_,i)=>`<button class="dot${i===idx?' active':''}" onclick="goSlide(${i})"></button>`).join('');
}

function ctaColor(bg){
  const m=bg.match(/#([0-9a-f]{6})/i);
  if(!m)return'#1D4ED8';
  const r=parseInt(m[1].slice(0,2),16),g=parseInt(m[1].slice(2,4),16),b=parseInt(m[1].slice(4,6),16);
  return(r*299+g*587+b*114)/1000<128?'#3B82F6':'#1D4ED8';
}

function goSlide(i){currentSlide=i%Math.max(BANNERS.filter(b=>b.type==='hero'&&b.active).length,1);renderBanners();resetTimer();}
function slidePrev(){goSlide(currentSlide-1+Math.max(BANNERS.filter(b=>b.type==='hero'&&b.active).length,1));}
function slideNext(){goSlide(currentSlide+1);}
function resetTimer(){clearInterval(slideTimer);slideTimer=setInterval(slideNext,4000);}

// ADMIN PANEL
function openAdmin(){document.getElementById('adminPanel').classList.add('on');renderAdminLists();}
function closeAdmin(){document.getElementById('adminPanel').classList.remove('on');}

function toggleForm(id=null){
  const fw=document.getElementById('bannerForm');
  const isOpen=fw.classList.contains('on');
  if(isOpen&&!id){fw.classList.remove('on');editId=null;return;}
  editId=id;
  if(id){
    const b=BANNERS.find(x=>x.id===id);
    if(b){
      document.getElementById('fTitle').value=b.title;
      document.getElementById('fSub').value=b.sub;
      document.getElementById('fDisc').value=b.disc;
      document.getElementById('fEmoji').value=b.emoji;
      document.getElementById('fType').value=b.type;
      selBg=b.bg;
    }
  }else{
    ['fTitle','fSub','fDisc','fEmoji'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fType').value='hero';
    selBg=BG_COLORS[0];
  }
  renderColorPickers();
  fw.classList.add('on');
}

function renderColorPickers(){
  document.getElementById('colorPickers').innerHTML=BG_COLORS.map((c,i)=>`<div class="cp${c===selBg?' sel':''}" style="background:${c}" onclick="selColor(${i})" title="Warna ${i+1}"></div>`).join('');
}

function selColor(i){selBg=BG_COLORS[i];renderColorPickers();}

function saveBanner(){
  const title=document.getElementById('fTitle').value.trim();
  if(!title){toast('Judul banner wajib diisi!');return;}
  const data={title,sub:document.getElementById('fSub').value.trim()||'Penawaran Terbatas',
    disc:parseInt(document.getElementById('fDisc').value)||0,
    emoji:document.getElementById('fEmoji').value.trim()||'🎁',
    type:document.getElementById('fType').value,bg:selBg,active:true};
  if(editId){
    const idx=BANNERS.findIndex(b=>b.id===editId);
    if(idx>-1)BANNERS[idx]={...BANNERS[idx],...data};
    toast('✅ Banner berhasil diperbarui!');
  }else{
    BANNERS.push({...data,id:'b'+Date.now()});
    toast('✅ Banner baru ditambahkan!');
  }
  editId=null;
  document.getElementById('bannerForm').classList.remove('on');
  currentSlide=0;renderBanners();renderAdminLists();
}

function toggleBanner(id){
  const b=BANNERS.find(x=>x.id===id);
  if(b){b.active=!b.active;currentSlide=0;renderBanners();renderAdminLists();toast(b.active?'✅ Banner diaktifkan':'Banner dinonaktifkan');}
}

function deleteBanner(id){
  BANNERS=BANNERS.filter(b=>b.id!==id);
  currentSlide=0;renderBanners();renderAdminLists();toast('🗑️ Banner dihapus');
}

function renderAdminLists(){
  ['hero','side'].forEach(type=>{
    const el=document.getElementById(type==='hero'?'heroBannerList':'sideBannerList');
    const items=BANNERS.filter(b=>b.type===type);
    el.innerHTML=items.length?items.map(b=>`
      <div class="banner-row">
        <div class="br-preview" style="background:${b.bg}">${b.emoji}</div>
        <div class="br-info">
          <div class="br-title">${b.title}</div>
          <div class="br-meta"><span class="br-type ${b.type}">${b.type==='hero'?'Hero':'Side'}</span>
            Diskon ${b.disc}% · ${b.active?'<span style="color:var(--success);font-weight:600">Aktif</span>':'<span style="color:var(--muted)">Nonaktif</span>'}
          </div>
        </div>
        <div class="br-acts">
          <label class="toggle-sw"><input type="checkbox" ${b.active?'checked':''} onchange="toggleBanner('${b.id}')"><span class="sl"></span></label>
          <button class="br-edit-btn" onclick="toggleForm('${b.id}')">Edit</button>
          <button class="br-del-btn" onclick="deleteBanner('${b.id}')">🗑</button>
        </div>
      </div>`).join(''):`<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">Belum ada banner ${type}</div>`;
  });
}

// FLASH SALE SCROLL
function renderFsScroll(){
  const items=PRODUCTS.filter(p=>p.badge==='disc'||p.badge==='hot').slice(0,10);
  const catCls={'Elektronik':'cat-el','Fashion':'cat-fa','Rumah & Dapur':'cat-rd','Kecantikan':'cat-kb','Olahraga':'cat-ol','Makanan':'cat-mk'};
  document.getElementById('fsScroll').innerHTML=items.map(p=>{
    const disc=p.orig?Math.round((1-p.price/p.orig)*100):0;
    return`<div class="fsp" onclick="addToCart(${p.id})">
      <div class="fsp-img ${catCls[p.cat]||'cat-el'}">${PIMGB64[p.id]?`<img src="${PIMGB64[p.id]}" loading="lazy" alt="">`:p.icon}</div>
      <div class="fsp-body">
        <div class="fsp-name">${p.name}</div>
        <div class="fsp-price">${fmt(p.price)}</div>
        ${p.orig?`<div class="fsp-orig">${fmt(p.orig)}</div><div class="fsp-disc-badge">-${disc}%</div>`:''}
      </div></div>`;
  }).join('');
}

function setCatFilter(cat){filters.cat=cat;renderCatFilter();renderProducts();setTab(document.querySelectorAll('.tab')[0],'products');}

function setTab(btn,tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.getElementById('productView').style.display=tab==='products'?'':'none';

function onSearch(){filters.q=document.getElementById('searchInput').value.toLowerCase();renderProducts();}
function setSort(v){filters.sort=v;renderProducts();}

function getFiltered(){
  let list=PRODUCTS.filter(p=>{
    const mn=parseInt(document.getElementById('pMin')?.value)||0;
    const mx=parseInt(document.getElementById('pMax')?.value)||Infinity;
    return(!filters.cat||p.cat===filters.cat)&&(!filters.seller||p.seller===filters.seller)&&
      (!filters.q||p.name.toLowerCase().includes(filters.q)||p.cat.toLowerCase().includes(filters.q))&&
      p.price>=mn&&p.price<=mx;
  });
  if(filters.sort==='price-asc')list.sort((a,b)=>a.price-b.price);
  else if(filters.sort==='price-desc')list.sort((a,b)=>b.price-a.price);
  else if(filters.sort==='rating')list.sort((a,b)=>b.rating-a.rating);
  else if(filters.sort==='sold')list.sort((a,b)=>b.sold-a.sold);
  return list;
}

function pHTML(p){
  const s=SELLERS.find(x=>x.id===p.seller);
  const disc=p.orig?Math.round((1-p.price/p.orig)*100):0;
  const inCart=cart.find(c=>c.pid===p.id);
  const catCls=CAT_CLASS[p.cat]||'cat-el';
  const imgBdgLeft=p.badge==='new'?`<span class="pbadge new">BARU</span>`:p.badge==='hot'?`<span class="pbadge hot">🔥 HOT</span>`:'';
  const discCircle=disc?`<div class="pdisc-circle">-${disc}%</div>`:'';
  const soldTxt=p.sold>=1000?(p.sold/1000).toFixed(1).replace('.0','')+'rb+':p.sold+'';
  const imgSrc=PIMGB64[p.id]||'';
  const imgTag=imgSrc?`<img src="${imgSrc}" loading="lazy" alt="">`:'<span class="pi-icon">'+p.icon+'</span>';
  return`<div class="pcard">
    <div class="pi ${catCls}">${imgTag}${imgBdgLeft}${discCircle}</div>
    <div class="pb">
      <div class="pname">${p.name}</div>
      <div class="pprow">
        <div class="pp">${fmt(p.price)}</div>
        ${p.orig?`<div class="ppo-row"><span class="ppo">${fmt(p.orig)}</span></div>`:''}
      </div>
      <div class="pbadge-row">
        <span class="pb-cod">Bisa COD</span>
        <span class="pb-free">Gratis Ongkir</span>
      </div>
      <div class="pst">⭐ ${p.rating} <span>· ${soldTxt} terjual</span></div>
      <div class="pselr" onclick="openSellerModal('${p.seller}',event)"><span class="pdot"></span>${s.name} · ${s.loc}</div>
    </div>
    <button class="padd-mini${inCart?' done':''}" onclick="addToCart(${p.id},event)" title="${inCart?'Sudah di keranjang':'Tambah ke keranjang'}">${inCart?'✓':'+'}</button>
  </div>`;
}

function renderProducts(){
  const list=getFiltered();
  document.getElementById('resCount').innerHTML=`Menampilkan <strong>${list.length}</strong> produk`;
  document.getElementById('productGrid').innerHTML=list.length?list.map(pHTML).join(''):`<div class="empty-state"><div style="font-size:32px;margin-bottom:8px">🔍</div><div style="font-size:15px;font-weight:600">Produk tidak ditemukan</div></div>`;
}

function renderProductsCustom(list){
  document.getElementById('resCount').innerHTML=`Menampilkan <strong>${list.length}</strong> produk`;
  document.getElementById('productGrid').innerHTML=list.map(pHTML).join('');
  setTab(document.querySelectorAll('.tab')[0],'products');
}

function renderSellerGrid(){
  document.getElementById('sellerGrid').innerHTML=SELLERS.map(s=>`
    <div class="scard" onclick="openSellerModal('${s.id}')">
      <div class="sc-ava">${s.icon}</div>
      <div class="sc-inf">
        <div class="sc-nm">${s.name}</div>
        <div class="sc-mt">${s.online?'<span class="online"></span>Online':'Offline'} · ${s.loc}</div>
        <div class="sc-sr">${'★'.repeat(Math.floor(s.star))} ${s.star} · ${s.sales.toLocaleString('id-ID')} terjual</div>
      </div>
    </div>`).join('');
}

function renderSideSellerList(){
  document.getElementById('sideSellerList').innerHTML=SELLERS.slice(0,5).map(s=>`
    <button class="seller-chip" onclick="filterSeller('${s.id}')">
      <div class="sa">${s.icon}</div>
      <div class="si"><div class="si-name">${s.name}</div><div class="si-meta">${s.loc} · ★${s.star}</div></div>
    </button>`).join('');
}

function filterSeller(sid){filters.seller=filters.seller===sid?'':sid;renderProducts();setTab(document.querySelectorAll('.tab')[0],'products');}

// SELLER MODAL
function openSellerModal(sid,e){
  if(e)e.stopPropagation();
  const s=SELLERS.find(x=>x.id===sid);
  const prods=PRODUCTS.filter(p=>p.seller===sid);
  document.getElementById('mHead').innerHTML=`
    <div class="mh-ava">${s.icon}</div>
    <div class="mh-info">
      <div class="mh-name">${s.name}</div>
      <div class="mh-sub">${s.online?'<span style="color:var(--success)">● Online</span>':'● Offline'} · ${s.loc}</div>
      <div class="mh-stats">
        <div class="mhs"><strong>${s.star}</strong>Rating</div>
        <div class="mhs"><strong>${s.sales.toLocaleString('id-ID')}</strong>Terjual</div>
        <div class="mhs"><strong>${prods.length}</strong>Produk</div>
      </div>
    </div>
    <button class="mclose" onclick="closeSellerModal()">✕</button>`;
  document.getElementById('mBody').innerHTML=`
    <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">Produk dari Toko Ini</div>
    <div class="pgrid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${prods.map(pHTML).join('')}</div>`;
  document.getElementById('sellerModal').classList.add('on');
}
function closeSellerModal(){document.getElementById('sellerModal').classList.remove('on');}

// CART
function addToCart(pid,e){
  if(e&&e.stopPropagation)e.stopPropagation();
  const ex=cart.find(c=>c.pid===pid);
  if(ex)ex.qty++;else cart.push({pid,qty:1});
  updateCartUI();renderProducts();
  toast(`${PRODUCTS.find(x=>x.id===pid).icon} Ditambahkan ke keranjang!`);
}

function chgQty(pid,d){
  const it=cart.find(c=>c.pid===pid);if(!it)return;
  it.qty+=d;if(it.qty<=0)cart=cart.filter(c=>c.pid!==pid);
  updateCartUI();renderProducts();
}

function rmItem(pid){cart=cart.filter(c=>c.pid!==pid);updateCartUI();renderProducts();}

function updateCartUI(){
  const qty=cart.reduce((s,c)=>s+c.qty,0);
  const val=cart.reduce((s,c)=>s+c.qty*(PRODUCTS.find(p=>p.id===c.pid)?.price||0),0);
  const badge=document.getElementById('cartBadge');
  badge.textContent=qty;badge.classList.toggle('on',qty>0);
  document.getElementById('cartTotal').textContent=fmt(val);
  renderCartBody();
}

function renderCartBody(){
  const el=document.getElementById('cartBody');
  if(!cart.length){el.innerHTML=`<div class="cart-empty"><div style="font-size:44px;opacity:.35">🛍️</div><div style="font-size:14px;font-weight:600;margin-top:8px">Keranjang masih kosong</div></div>`;return;}
  const groups={};
  cart.forEach(ci=>{const p=PRODUCTS.find(x=>x.id===ci.pid);if(!groups[p.seller])groups[p.seller]=[];groups[p.seller].push(ci);});
  let html='';
  for(const[sid,items]of Object.entries(groups)){
    const s=SELLERS.find(x=>x.id===sid);
    html+=`<div><div class="csg-head"><div class="csg-ava">${s.icon}</div><div class="csg-nm">${s.name}</div></div>
    ${items.map(ci=>{const p=PRODUCTS.find(x=>x.id===ci.pid);
      return`<div class="ci"><div class="ci-ico">${p.icon}</div><div class="ci-i">
        <div class="ci-nm">${p.name}</div><div class="ci-pr">${fmt(p.price)}</div>
        <div class="ci-qty"><button class="qb" onclick="chgQty(${p.id},-1)">−</button><span class="qn">${ci.qty}</span><button class="qb" onclick="chgQty(${p.id},1)">+</button></div>
      </div><button class="ci-del" onclick="rmItem(${p.id})">🗑</button></div>`;}).join('')}</div>`;
  }
  el.innerHTML=html;
}

function openCart(){document.getElementById('cartDrawer').classList.add('on');document.getElementById('cartOverlay').classList.add('on');}
function closeCart(){document.getElementById('cartDrawer').classList.remove('on');document.getElementById('cartOverlay').classList.remove('on');}
function doCheckout(){
  if(!cart.length){toast('Keranjang masih kosong!');return;}
  const total=fmt(cart.reduce((s,c)=>s+c.qty*(PRODUCTS.find(p=>p.id===c.pid)?.price||0),0));
  cart=[];updateCartUI();renderProducts();closeCart();toast(`✅ Pesanan ${total} berhasil dibuat!`);
}

// FLASH SALE TIMER
function initTimer(){
  const end=new Date();end.setMinutes(end.getMinutes()+5,44,0);
  function tick(){
    const diff=Math.max(0,end-new Date());
    document.getElementById('tH').textContent=String(Math.floor(diff/3600000)).padStart(2,'0');
    document.getElementById('tM').textContent=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
    document.getElementById('tS').textContent=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  }
  tick();setInterval(tick,1000);
}

// UTILS
function fmt(n){return'Rp '+n.toLocaleString('id-ID');}
let toastT;
function toast(msg){const t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2500);}

// INIT
renderBanners();
renderColorPickers();
renderCatFilter();
renderSideSellerList();
renderSellerGrid();
renderProducts();
renderFsScroll();
updateCartUI();
initTimer();
resetTimer();
</script>
